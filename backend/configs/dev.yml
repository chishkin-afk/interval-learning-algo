app:
  name: intask-backend
  version: v0.0.1
  env: ${APP_ENV}

server:
  http:
    addr: ${HTTP_ADDR}
    tls:
      enable: false
      server_cert_path: ./certs/server.crt
      server_key_path: ./certs/server.key
  conns:
    read_timeout: 2s
    write_timeout: 2s
    idle_timeout: 30s

persistence:
  postgres:
    host: ${POSTGRES_HOST}
    port: ${POSTGRES_PORT}
    sslmode: disable
    auth:
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      db: ${POSTGRES_DB}
    conns:
      max_opens: 5
      max_idles: 15
      max_lifetime: 15m
      max_idle_time: 30m

jwt:
  ttl: 168h
  private_key_path: ./keys/jwtRS256.key
  public_key_path: ./keys/jwtRS256.key.pub

telegram:
  bot_token: ${TELEGRAM_TOKEN}
  timeout: 30s